<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <!-- Background subtle radial glow -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#047857" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#047857" stop-opacity="0" />
    </radialGradient>

    <!-- Warm Nest Gradients -->
    <linearGradient id="nestOuter" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b45309" />
      <stop offset="50%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <linearGradient id="nestInner" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#78350f" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>

    <!-- Emerald Leaf / Heart Wings -->
    <linearGradient id="wingLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <linearGradient id="wingRight" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>

    <!-- Golden Grain / Sun Accent -->
    <linearGradient id="grainGold" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>

    <!-- Soft Drop Shadows -->
    <filter id="shadowLight" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#064e3b" flood-opacity="0.25" />
    </filter>
    <filter id="glowCenter" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Ambient Glow -->
  <circle cx="100" cy="100" r="92" fill="url(#bgGlow)" />

  <!-- Outer Protective Halo Ring (Community Unity) -->
  <circle cx="100" cy="100" r="88" stroke="#059669" stroke-width="2.5" stroke-dasharray="8 6" stroke-opacity="0.35" />

  <!-- NEST CRADLE (Base: Care & Haven) -->
  <g filter="url(#shadowLight)">
    <!-- Lower Cradle Hull -->
    <path d="M 40 120 C 40 162 160 162 160 120 C 145 152 55 152 40 120 Z" fill="url(#nestInner)" />
    <!-- Outer Intertwined Twigs / Supportive Ribs -->
    <path d="M 32 112 C 48 166 152 166 168 112 C 150 156 50 156 32 112 Z" fill="url(#nestOuter)" />
    <!-- Delicate Warm Weave Lines -->
    <path d="M 45 128 Q 100 160 155 128" stroke="#fef3c7" stroke-width="2.2" stroke-linecap="round" stroke-opacity="0.6" />
    <path d="M 56 138 Q 100 165 144 138" stroke="#fef3c7" stroke-width="1.8" stroke-linecap="round" stroke-opacity="0.4" />
  </g>

  <!-- CARING HANDS / DOVE WINGS (Forming an Open Heart & Guardian Dove) -->
  <g filter="url(#shadowLight)">
    <!-- Left Caring Wing / Hand Shape -->
    <path d="M 100 118 C 88 110 50 96 46 64 C 44 46 60 36 74 42 C 86 48 94 66 100 80 Z" fill="url(#wingLeft)" />
    
    <!-- Right Caring Wing / Hand Shape -->
    <path d="M 100 118 C 112 110 150 96 154 64 C 156 46 140 36 126 42 C 114 48 106 66 100 80 Z" fill="url(#wingRight)" />

    <!-- Interior Heart Cutout / Embraced Space -->
    <path d="M 100 102 C 92 88 72 68 76 56 C 80 48 90 48 96 56 L 100 62 L 104 56 C 110 48 120 48 124 56 C 128 68 108 88 100 102 Z" fill="#ffffff" fill-opacity="0.95" />
  </g>

  <!-- GOLDEN GRAIN / NOURISHMENT SPROUT (Surplus Food & Hope in Center) -->
  <g filter="url(#glowCenter)">
    <!-- Central Golden Sprout Stem -->
    <path d="M 100 96 Q 100 70 100 58" stroke="#f59e0b" stroke-width="3" stroke-linecap="round" />
    
    <!-- Left Grain Husk -->
    <path d="M 100 82 C 94 80 88 74 91 66 C 94 65 99 72 100 78 Z" fill="url(#grainGold)" />
    <!-- Right Grain Husk -->
    <path d="M 100 74 C 106 72 112 66 109 58 C 106 57 101 64 100 70 Z" fill="url(#grainGold)" />
    
    <!-- Top Beacon / Pearl of Care (Sun / Golden Sparkle) -->
    <circle cx="100" cy="52" r="5" fill="#fbbf24" />
    <path d="M 100 42 L 101.5 48.5 L 108 50 L 101.5 51.5 L 100 58 L 98.5 51.5 L 92 50 L 98.5 48.5 Z" fill="#f59e0b" />
  </g>
</svg>
